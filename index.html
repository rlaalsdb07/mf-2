<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATTLE ROYALE RPG</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase JS SDK (v8 / Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-skull-crossbones text-2xl text-amber-500"></i>
            <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
                BATTLE ROYALE RPG
            </h1>
        </div>
        <div id="connection-status" class="text-xs px-3 py-1 rounded-full bg-slate-700 text-slate-300 font-medium">
            초기화 중...
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6 max-w-4xl flex-grow flex flex-col justify-center">

        <!-- SCREEN 1: LOBBY (방 입장 / 생성) -->
        <div id="screen-lobby" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-2xl max-w-md mx-auto w-full">
            <h2 class="text-2xl font-bold text-center mb-6 text-slate-100">게임 입장</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">플레이어 이름</label>
                    <input type="text" id="input-nickname" maxlength="10" placeholder="닉네임을 입력하세요" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 transition">
                </div>

                <div class="pt-4 border-t border-slate-700/50 flex flex-col gap-3">
                    <button id="btn-create-room" onclick="createRoom()" 
                            class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 active:scale-[0.98]">
                        새 방 만들기
                    </button>
                    
                    <div class="flex gap-2">
                        <input type="text" id="input-room-code" maxlength="6" placeholder="방 코드 (6자리)" 
                               class="w-2/3 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center tracking-widest font-mono text-slate-100 uppercase focus:outline-none focus:border-amber-500">
                        <button onclick="joinRoom()" 
                                class="w-1/3 bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-3 rounded-xl transition active:scale-[0.98]">
                            참가
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SCREEN 2: WAITING ROOM (대기실) -->
        <div id="screen-room-waiting" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-2xl w-full">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-700 mb-6">
                <div>
                    <span class="text-xs font-semibold text-amber-500 tracking-wider uppercase">Lobby Room</span>
                    <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
                        대기실 참가자 목록
                    </h2>
                </div>
                <div class="flex items-center gap-3">
                    <div class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-center">
                        <span class="text-xs text-slate-400 block">방 코드</span>
                        <span id="display-room-code" class="text-lg font-mono font-bold text-amber-400">------</span>
                    </div>
                    <button onclick="leaveRoom()" class="bg-slate-700 hover:bg-red-500/20 hover:text-red-400 text-slate-300 px-4 py-2 rounded-xl text-sm transition">
                        나가기
                    </button>
                </div>
            </div>

            <!-- 참가자 카드가 출력되는 영역 -->
            <div id="waiting-player-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <!-- JS에서 동적으로 Player Card가 삽입됩니다 -->
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                <p id="waiting-status-text" class="text-sm text-slate-400 text-center sm:text-left">
                    방장이 게임을 시작하기를 기다리는 중...
                </p>
                <button id="btn-start-game" onclick="startGame()" disabled 
                        class="w-full sm:w-auto px-8 py-3 bg-amber-500 disabled:bg-slate-700 disabled:text-slate-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition shadow-lg active:scale-[0.98]">
                    게임 시작
                </button>
            </div>
        </div>

        <!-- SCREEN 3: GAMEPLAY (게임 진행) -->
        <div id="screen-gameplay" class="hidden flex flex-col gap-6">
            <!-- Phase & Status Bar -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center">
                <div>
                    <span id="game-phase-text" class="text-xs font-bold text-amber-500 uppercase tracking-wider">탐색 페이즈</span>
                    <h3 id="game-turn-info" class="text-lg font-bold text-slate-100">턴 1</h3>
                </div>
                <div id="player-alive-count" class="text-sm font-semibold text-slate-300 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                    생존자: - / -
                </div>
            </div>

            <!-- 플레이어 카드 리스트 -->
            <div id="game-players-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 게임 상태 카드 동적 생성 -->
            </div>

            <!-- 액션 패널 -->
            <div id="game-action-panel" class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-wrap gap-3 justify-center">
                <button onclick="takeAction('explore')" class="flex-1 min-w-[120px] bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition">
                    🔍 지역 탐색
                </button>
                <button onclick="takeAction('rest')" class="flex-1 min-w-[120px] bg-emerald-600 hover:bg-emerald-500 text-slate-100 font-bold py-3 px-4 rounded-xl transition">
                    🏕️ 휴식 (HP 회복)
                </button>
                <button onclick="openInventory()" class="flex-1 min-w-[120px] bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-3 px-4 rounded-xl transition">
                    🎒 인벤토리
                </button>
            </div>

            <!-- 게임 로그 -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 h-48 flex flex-col">
                <span class="text-xs font-bold text-slate-500 mb-2 block">활동 로그</span>
                <div id="game-log-box" class="flex-grow overflow-y-auto custom-scrollbar text-sm space-y-1 text-slate-300 font-mono">
                    <!-- 로그 메시지 출력 -->
                </div>
            </div>
        </div>

    </main>

    <!-- Custom Modal System (Alert replacement) -->
    <div id="modal-alert" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
            <i id="alert-icon" class="fa-solid fa-circle-info text-3xl text-amber-500"></i>
            <p id="alert-message" class="text-slate-200 font-medium">알림 메시지</p>
            <button onclick="closeAlert()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-2.5 rounded-xl transition">
                확인
            </button>
        </div>
    </div>

    <!-- Inventory Modal -->
    <div id="modal-inventory" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-slate-100">🎒 인벤토리</h3>
                <button onclick="closeInventory()" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="inventory-item-list" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                <!-- 아이템 리스트 -->
            </div>
        </div>
    </div>

    <footer class="py-4 text-center text-xs text-slate-500">
        Battle Royale RPG &copy; 2026. Powered by Firebase Realtime DB.
    </footer>

    <!-- MAIN GAME SCRIPT -->
    <script>
        // ====================================================
        // Firebase Configuration (적용 완료)
        // ====================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAc5sFR859k7BldgRr5w6wfMGfol3Awi3w",
            authDomain: "mfserver-cd778.firebaseapp.com",
            databaseURL: "https://mfserver-cd778-default-rtdb.firebaseio.com",
            projectId: "mfserver-cd778",
            storageBucket: "mfserver-cd778.firebasestorage.app",
            messagingSenderId: "3964648295",
            appId: "1:3964648295:web:04a34338c9701bac5f3c62",
            measurementId: "G-RLXTD2X2F9"
        };

        // App States
        let db = null;
        let isFirebaseAvailable = false;
        let currentRoomCode = null;
        let myPlayerId = null;
        let isHost = false;
        let roomRef = null;
        let roomData = null;

        // Custom Modal Alert Helper
        function showAlert(msg, iconClass = "fa-circle-info text-amber-500") {
            const modal = document.getElementById("modal-alert");
            const msgEl = document.getElementById("alert-message");
            const iconEl = document.getElementById("alert-icon");
            if (msgEl) msgEl.innerText = msg;
            if (iconEl) iconEl.className = `fa-solid ${iconClass} text-3xl`;
            if (modal) modal.classList.remove("hidden");
        }

        function closeAlert() {
            const modal = document.getElementById("modal-alert");
            if (modal) modal.classList.add("hidden");
        }

        // Initialize Firebase
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
            isFirebaseAvailable = true;
            document.getElementById("connection-status").innerText = "온라인 (Firebase 연결됨)";
            document.getElementById("connection-status").className = "text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-medium";
        } catch (e) {
            console.warn("Firebase Init failed. Fallback to Local Mode:", e);
            document.getElementById("connection-status").innerText = "오프라인 (로컬 테스트 모드)";
            document.getElementById("connection-status").className = "text-xs px-3 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-medium";
        }

        // Helper: Generate 6-digit Code
        function generateRoomCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Helper: Random ID
        function generateId() {
            return 'p_' + Math.random().toString(36).substr(2, 9);
        }

        // Create Room
        function createRoom() {
            const nicknameInput = document.getElementById("input-nickname");
            const name = nicknameInput ? nicknameInput.value.trim() : "";
            
            if (!name) {
                showAlert("닉네임을 입력해 주세요!");
                return;
            }

            myPlayerId = generateId();
            isHost = true;

            if (isFirebaseAvailable && db) {
                currentRoomCode = generateRoomCode();
                roomRef = db.ref("rooms/" + currentRoomCode);

                const initialData = {
                    code: currentRoomCode,
                    status: "waiting", // waiting, playing, ended
                    hostId: myPlayerId,
                    players: {
                        [myPlayerId]: {
                            id: myPlayerId,
                            name: name,
                            hp: 100,
                            maxHp: 100,
                            atk: 15,
                            def: 5,
                            isHost: true,
                            isAlive: true,
                            items: []
                        }
                    },
                    logs: ["방이 생성되었습니다."]
                };

                roomRef.set(initialData).then(() => {
                    listenToRoom();
                    switchScreen("screen-room-waiting");
                }).catch(err => {
                    showAlert("방 생성에 실패했습니다: " + err.message);
                });
            } else {
                // Offline Fallback Mode
                currentRoomCode = "LOCAL1";
                roomData = {
                    code: currentRoomCode,
                    status: "waiting",
                    hostId: myPlayerId,
                    players: {
                        [myPlayerId]: { id: myPlayerId, name: name, hp: 100, maxHp: 100, atk: 15, def: 5, isHost: true, isAlive: true, items: [] },
                        "bot_1": { id: "bot_1", name: "AI 훈련봇", hp: 80, maxHp: 80, atk: 10, def: 2, isHost: false, isAlive: true, items: [] }
                    },
                    logs: ["로컬 모드로 시작되었습니다."]
                };
                renderWaitingRoom();
                switchScreen("screen-room-waiting");
            }
        }

        // Join Room
        function joinRoom() {
            const nicknameInput = document.getElementById("input-nickname");
            const roomCodeInput = document.getElementById("input-room-code");
            const name = nicknameInput ? nicknameInput.value.trim() : "";
            const code = roomCodeInput ? roomCodeInput.value.trim() : "";

            if (!name) {
                showAlert("닉네임을 입력해 주세요!");
                return;
            }
            if (!code) {
                showAlert("방 코드를 입력해 주세요!");
                return;
            }

            if (!isFirebaseAvailable || !db) {
                showAlert("오프라인 상태에서는 다른 방에 입장할 수 없습니다.");
                return;
            }

            myPlayerId = generateId();
            isHost = false;
            currentRoomCode = code;
            roomRef = db.ref("rooms/" + currentRoomCode);

            roomRef.once("value").then(snapshot => {
                if (!snapshot.exists()) {
                    showAlert("존재하지 않는 방 코드입니다.");
                    return;
                }
                const data = snapshot.val();
                if (data.status !== "waiting") {
                    showAlert("이미 게임이 진행 중이거나 종료된 방입니다.");
                    return;
                }

                // Add Self to Room
                roomRef.child("players/" + myPlayerId).set({
                    id: myPlayerId,
                    name: name,
                    hp: 100,
                    maxHp: 100,
                    atk: 15,
                    def: 5,
                    isHost: false,
                    isAlive: true,
                    items: []
                }).then(() => {
                    listenToRoom();
                    switchScreen("screen-room-waiting");
                });
            }).catch(err => {
                showAlert("입장 중 오류 발생: " + err.message);
            });
        }

        // Listen to Firebase Updates
        function listenToRoom() {
            if (!roomRef) return;
            roomRef.on("value", snapshot => {
                if (!snapshot.exists()) {
                    showAlert("방이 삭제되었거나 존재하지 않습니다.");
                    leaveRoom();
                    return;
                }
                roomData = snapshot.val();
                
                if (roomData.status === "waiting") {
                    renderWaitingRoom();
                } else if (roomData.status === "playing") {
                    switchScreen("screen-gameplay");
                    renderGameplayUI();
                }
            });
        }

        // Leave Room
        function leaveRoom() {
            if (roomRef && myPlayerId) {
                roomRef.child("players/" + myPlayerId).remove();
                roomRef.off();
            }
            roomRef = null;
            roomData = null;
            currentRoomCode = null;
            switchScreen("screen-lobby");
        }

        // Render Waiting Room UI
        function renderWaitingRoom() {
            const listEl = document.getElementById("waiting-player-list");
            const codeEl = document.getElementById("display-room-code");
            const startBtn = document.getElementById("btn-start-game");
            const statusTxt = document.getElementById("waiting-status-text");

            if (codeEl) codeEl.innerText = currentRoomCode || "------";
            if (!listEl || !roomData) return;

            listEl.innerHTML = "";
            const players = roomData.players || {};
            const playerArray = Object.values(players);

            playerArray.forEach(p => {
                const card = document.createElement("div");
                card.className = "bg-slate-900 border border-slate-700/80 rounded-xl p-4 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center font-bold text-amber-400">
                            ${p.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div class="font-bold text-slate-200 flex items-center gap-2">
                                ${p.name}
                                ${p.isHost ? '<span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded">방장</span>' : ''}
                                ${p.id === myPlayerId ? '<span class="text-[10px] bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded">나</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-400">HP: ${p.hp}/${p.maxHp}</div>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });

            if (startBtn) {
                if (isHost) {
                    startBtn.disabled = playerArray.length < 1;
                    if (statusTxt) statusTxt.innerText = "모든 참가자가 준비되면 게임을 시작하세요.";
                } else {
                    startBtn.disabled = true;
                    if (statusTxt) statusTxt.innerText = "방장이 게임을 시작하기를 기다리는 중...";
                }
            }
        }

        // Start Game
        function startGame() {
            if (!isHost) return;
            if (isFirebaseAvailable && roomRef) {
                roomRef.update({
                    status: "playing",
                    turn: 1
                });
            } else if (roomData) {
                roomData.status = "playing";
                roomData.turn = 1;
                switchScreen("screen-gameplay");
                renderGameplayUI();
            }
        }

        // Render Gameplay UI
        function renderGameplayUI() {
            if (!roomData) return;

            const turnInfo = document.getElementById("game-turn-info");
            const aliveCount = document.getElementById("player-alive-count");
            const grid = document.getElementById("game-players-grid");
            const logBox = document.getElementById("game-log-box");

            if (turnInfo) turnInfo.innerText = `턴 ${roomData.turn || 1}`;

            const players = Object.values(roomData.players || {});
            const alivePlayers = players.filter(p => p.isAlive);

            if (aliveCount) aliveCount.innerText = `생존자: ${alivePlayers.length} / ${players.length}`;

            if (grid) {
                grid.innerHTML = "";
                players.forEach(p => {
                    const hpPercent = Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100));
                    const card = document.createElement("div");
                    card.className = `p-4 rounded-xl border ${p.isAlive ? 'bg-slate-800 border-slate-700' : 'bg-slate-900/50 border-red-900/30 opacity-60'}`;
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-slate-200">${p.name} ${!p.isAlive ? '(사망)' : ''}</span>
                            <span class="text-xs font-mono text-slate-400">HP ${p.hp}/${p.maxHp}</span>
                        </div>
                        <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700">
                            <div class="bg-gradient-to-r from-red-500 to-emerald-500 h-full transition-all duration-300" style="width: ${hpPercent}%"></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            if (logBox && roomData.logs) {
                logBox.innerHTML = roomData.logs.map(log => `<div>> ${log}</div>`).join('');
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        // Action Handlers
        function takeAction(actionType) {
            if (!roomData || roomData.status !== "playing") return;
            const me = roomData.players ? roomData.players[myPlayerId] : null;
            if (!me || !me.isAlive) {
                showAlert("이미 사망하였거나 참가 상태가 아닙니다.");
                return;
            }

            let logMsg = "";
            if (actionType === "explore") {
                const foundHp = Math.floor(Math.random() * 15) + 5;
                me.hp = Math.min(me.maxHp, me.hp + foundHp);
                logMsg = `${me.name} 님이 탐색을 통해 아이템을 찾고 체력을 ${foundHp} 회복했습니다.`;
            } else if (actionType === "rest") {
                const heal = 20;
                me.hp = Math.min(me.maxHp, me.hp + heal);
                logMsg = `${me.name} 님이 휴식을 취하여 체력을 ${heal} 회복했습니다.`;
            }

            if (!roomData.logs) roomData.logs = [];
            roomData.logs.push(logMsg);

            if (isFirebaseAvailable && roomRef) {
                roomRef.update({
                    players: roomData.players,
                    logs: roomData.logs
                });
            } else {
                renderGameplayUI();
            }
        }

        // Inventory Handlers
        function openInventory() {
            const modal = document.getElementById("modal-inventory");
            const list = document.getElementById("inventory-item-list");
            if (modal) modal.classList.remove("hidden");
            if (list) {
                list.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">소지품이 비어있습니다.</p>`;
            }
        }

        function closeInventory() {
            const modal = document.getElementById("modal-inventory");
            if (modal) modal.classList.add("hidden");
        }

        // Screen Switcher
        function switchScreen(screenId) {
            ["screen-lobby", "screen-room-waiting", "screen-gameplay"].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (id === screenId) el.classList.remove("hidden");
                    else el.classList.add("hidden");
                }
            });
        }
    </script>
</body>
